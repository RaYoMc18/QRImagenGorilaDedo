<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagen Fullscreen</title>
    <style>
        body { margin: 0; background: black; overflow: hidden; }
        img { width: 100vw; height: 100vh; object-fit: contain; }
    </style>
</head>
<body>
    <img src="gorila.jpg">
</body>
</html>
